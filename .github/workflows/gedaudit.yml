# gedaudit: die Pakete fuer Linux (deb), Windows (Inno-Setup-exe) und macOS (dmg, Apple Silicon und Intel), gebaut auf
# GitHub (13.10.2026). Von Hand (Actions > gedaudit > Run workflow): die Pakete liegen dann unter "Artifacts" des Laufs.
# Bei einem veroeffentlichten Release mit Tag gedaudit-*: bauen und die Pakete an das Release haengen.
name: gedaudit

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deb:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'gedaudit-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests des Lesers
        run: ./gradlew --no-daemon :shared:desktopTest --tests 'de.bgghome.webtrees.nativ.gedcom.*' --tests 'de.bgghome.webtrees.nativ.pruefung.*'
      - name: deb bauen
        run: ./gradlew --no-daemon :gedaudit:packageDeb
      - uses: actions/upload-artifact@v4
        with:
          name: gedaudit-deb
          path: gedaudit/build/compose/binaries/main/deb/*.deb
      - name: An das Release haengen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" gedaudit/build/compose/binaries/main/deb/*.deb --clobber

  exe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'gedaudit-')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Inno Setup pruefen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Installer bauen
        run: ./gradlew --no-daemon :gedaudit:packageInno
      - uses: actions/upload-artifact@v4
        with:
          name: gedaudit-windows
          path: gedaudit/build/compose/binaries/main/inno/*.exe
      - name: An das Release haengen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" gedaudit/build/compose/binaries/main/inno/*.exe --clobber

  dmg:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'gedaudit-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Das icns aus dem PNG mit Apples iconutil bauen: das von Hand erzeugte icns nahm jpackage nicht an (13.10.2026).
      - name: Icon (icns) erzeugen
        run: |
          set -e
          rm -rf app.iconset && mkdir app.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s gedaudit/icons/app.png --out app.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d gedaudit/icons/app.png --out app.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns app.iconset -o gedaudit/icons/app.icns
          ls -la gedaudit/icons/app.icns
      - name: dmg bauen
        run: ./gradlew --no-daemon :gedaudit:packageDmg
      - name: jpackage-Protokoll bei Fehler
        if: failure()
        run: for f in gedaudit/build/compose/logs/*/*.txt; do echo "== $f"; cat "$f"; done
      - name: Datei nach Prozessor benennen
        run: |
          mkdir -p out
          # Dateiname mit der echten Nummer (0.x.<Commits>); das Bundle traegt 1.0.x, weil macOS keine 0 vorn erlaubt
          V="$(grep '^gedaudit.versionName=' gradle.properties | cut -d= -f2).$(git rev-list --count HEAD)"
          for f in gedaudit/build/compose/binaries/main/dmg/*.dmg; do
            cp "$f" "out/gedaudit-$V-${{ matrix.arch }}.dmg"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: gedaudit-mac-${{ matrix.arch }}
          path: out/*.dmg
      - name: An das Release haengen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.dmg --clobber
